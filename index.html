<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Protein Tracker</title><style>
:root{--bg:#f5f7fb;--card:#fff;--t:#111827;--m:#6b7280;--b:#e5e7eb;--a:#2563eb;--ab:#eff6ff;--d:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--t)}.app{max-width:760px;margin:auto;padding:18px 14px 90px}.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:16px;margin-bottom:14px}header{display:flex;justify-content:space-between}h1{margin:0;font-size:24px}.muted{color:var(--m);font-size:13px}.hero{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}@media(max-width:520px){.hero{grid-template-columns:1fr}}.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--a) var(--pct),#e5e7eb 0)}.ring:after{content:"";width:102px;height:102px;background:white;border-radius:50%;position:absolute}.ringtext{position:relative;z-index:1;text-align:center}.ringtext b{display:block;font-size:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--b);border-radius:12px;padding:10px}.stat b{display:block}.row{display:grid;grid-template-columns:28px 1fr 105px 42px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b)}.food{font-weight:650}input,select,button{font:inherit}input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:9px;background:#fff}button{border:0;border-radius:9px;padding:9px 12px;background:var(--ab);color:var(--a);font-weight:650}.danger{color:var(--d);background:#fef2f2}.add{display:grid;grid-template-columns:1.4fr .7fr .8fr .8fr .8fr auto;gap:7px;align-items:end}@media(max-width:650px){.add{grid-template-columns:1fr 1fr}.add button{grid-column:1/-1}}.db{padding:11px 0;border-bottom:1px solid var(--b);display:grid;grid-template-columns:1fr auto;gap:8px}.actions{display:flex;gap:6px}.edit{display:none;grid-column:1/-1;grid-template-columns:1.3fr .7fr .8fr .8fr .8fr auto;gap:6px}.edit.open{display:grid}@media(max-width:650px){.edit{grid-template-columns:1fr 1fr}}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:center;gap:50px;padding:8px}nav button{background:none;color:var(--m)}nav .active{color:var(--a)}.view{display:none}.view.active{display:block}.hist{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--b)}
</style></head><body><div class="app"><header><div><h1>Protein Tracker</h1><div class="muted" id="date"></div></div><button id="install" style="display:none">Install</button></header>
<section id="today" class="view active"><div class="card hero"><div class="ring" id="ring"><div class="ringtext"><b id="pt">0</b><span class="muted">g protein</span></div></div><div><label class="muted">Daily protein target</label><input id="target" type="number" min="0"><div style="height:10px"></div><div class="stats"><div class="stat"><b id="cal">0</b><small class="muted">kcal</small></div><div class="stat"><b id="carb">0</b><small class="muted">g carbs</small></div><div class="stat"><b id="fat">0</b><small class="muted">g fat</small></div></div><p class="muted" id="rem"></p></div></div><div class="card"><h3>Today's foods</h3><div id="foods"></div><button id="clear" class="danger">Clear today</button></div></section>
<section id="history" class="view"><div class="card"><h3>History</h3><div id="hist"></div></div></section>
<section id="fooddb" class="view"><div class="card"><h3>Add food</h3><div class="muted">Nutrition values are per 100 of the reference unit. Choose the unit you normally enter.</div><div class="add"><div><label class="muted">Name</label><input id="nn" placeholder="Tofu"></div><div><label class="muted">Unit</label><select id="nu"><option>g</option><option>ml</option><option>piece</option><option>scoop</option></select></div><div><label class="muted">Protein</label><input id="np" type="number"></div><div><label class="muted">Calories</label><input id="nk" type="number"></div><div><label class="muted">Carbs</label><input id="nc" type="number"></div><button id="add">Add</button></div></div><div class="card"><h3>Your food database</h3><div class="muted">Edit or delete foods whenever you want.</div><div id="db"></div></div></section></div><nav><button class="active" data-v="today">Today</button><button data-v="history">History</button><button data-v="fooddb">Foods</button></nav>
<script>
const KEY='proteinTrackerV2';const defaults=[['Soya chunks (dry)','g',52,345,33,.5],['Paneer','g',18,265,3.4,20],['Egg','piece',12.6,143,1.1,9.5],['Milk','ml',3.2,60,4.8,3.2],['Curd','g',3.5,60,4.7,3.3],['Whey protein','scoop',24,120,3,2],['Dal (cooked)','g',8,115,20,.4],['Rajma (cooked)','g',8.7,127,22.8,.5],['Chana (cooked)','g',8.9,164,27.4,2.6],['Besan','g',22,387,58,6.7],['Peanuts','g',25.8,567,16.1,49.2],['Tofu','g',17,144,2.8,8.7]];let s=JSON.parse(localStorage.getItem(KEY)||'null')||{foods:defaults.map((x,i)=>({id:'d'+i,n:x[0],u:x[1],p:x[2],k:x[3],c:x[4],f:x[5]})),target:140,days:{}};s.foods=s.foods||[];s.days=s.days||{};const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(s)),date=()=>new Date().toISOString().slice(0,10),day=()=>s.days[date()]||(s.days[date()]={});function esc(x){return String(x).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}function calc(d=day()){let a={p:0,k:0,c:0,f:0};s.foods.forEach(x=>{let q=+d[x.id]||0,m=q/100;a.p+=x.p*m;a.k+=x.k*m;a.c+=x.c*m;a.f+=x.f*m});return a}
function render(){let d=day();$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('target').value=s.target;$('foods').innerHTML=s.foods.map(x=>`<div class="row"><input type="checkbox" data-ch="${x.id}" ${d[x.id]!=null?'checked':''}><div><div class="food">${esc(x.n)}</div><div class="muted">${x.p}g P · ${x.k} kcal / 100 ${esc(x.u)}</div></div><input data-q="${x.id}" type="number" min="0" step=".1" value="${d[x.id]??''}" placeholder="${x.u}"><span class="muted">${x.u}</span></div>`).join('')||'<p class="muted">No foods yet.</p>';$('db').innerHTML=s.foods.map(x=>`<div class="db"><div><b>${esc(x.n)}</b><div class="muted">${x.u} · ${x.p}g P · ${x.k} kcal · ${x.c}g carbs / 100</div></div><div class="actions"><button data-ed="${x.id}">Edit</button><button class="danger" data-del="${x.id}">Delete</button></div><div class="edit" id="e${x.id}"><input data-n="${x.id}" value="${esc(x.n)}"><select data-u="${x.id}"><option>g</option><option>ml</option><option>piece</option><option>scoop</option></select><input data-p="${x.id}" type="number" value="${x.p}"><input data-k="${x.id}" type="number" value="${x.k}"><input data-c="${x.id}" type="number" value="${x.c}"><button data-save="${x.id}">Save</button></div></div>`).join('')||'<p class="muted">No foods in database.</p>';document.querySelectorAll('[data-ch]').forEach(e=>e.onchange=()=>{let id=e.dataset.ch;e.checked?d[id]=100:delete d[id];save();render()});document.querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>{let v=+e.value,id=e.dataset.q;if(v>=0)d[id]=v;else delete d[id];save();update()});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{let x=s.foods.find(a=>a.id==e.dataset.del);if(x&&confirm(`Delete "${x.n}"?`)){s.foods=s.foods.filter(a=>a.id!=x.id);save();render()}});document.querySelectorAll('[data-ed]').forEach(e=>e.onclick=()=>{let x=s.foods.find(a=>a.id==e.dataset.ed),b=$('e'+x.id);b.classList.toggle('open');b.querySelector(`[data-u="${x.id}"]`).value=x.u});document.querySelectorAll('[data-save]').forEach(e=>e.onclick=()=>{let id=e.dataset.save,x=s.foods.find(a=>a.id==id);x.n=document.querySelector(`[data-n="${id}"]`).value.trim();x.u=document.querySelector(`[data-u="${id}"]`).value;x.p=+document.querySelector(`[data-p="${id}"]`).value;x.k=+document.querySelector(`[data-k="${id}"]`).value;x.c=+document.querySelector(`[data-c="${id}"]`).value;save();render()});update();hist()}
function update(){let a=calc(),t=+s.target||0;$('pt').textContent=a.p.toFixed(1);$('cal').textContent=Math.round(a.k);$('carb').textContent=a.c.toFixed(1);$('fat').textContent=a.f.toFixed(1);$('rem').textContent=a.p>=t?`${(a.p-t).toFixed(1)} g above target`:`${(t-a.p).toFixed(1)} g remaining`;$('ring').style.setProperty('--pct',(t?Math.min(100,a.p/t*100):0)+'%')};function hist(){let ks=Object.keys(s.days).sort().reverse();$('hist').innerHTML=ks.length?ks.map(k=>{let a=calc(s.days[k]);return `<div class="hist"><span>${new Date(k+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</span><b>${a.p.toFixed(1)} g P · ${Math.round(a.k)} kcal</b></div>`}).join(''):'<p class="muted">No saved days yet.</p>'}
$('target').oninput=e=>{s.target=Math.max(0,+e.target.value||0);save();update()};$('clear').onclick=()=>{if(confirm('Clear today?')){delete s.days[date()];save();render()}};$('add').onclick=()=>{let n=$('nn').value.trim(),p=+$('np').value,k=+$('nk').value,c=+$('nc').value||0;if(!n||p<0||k<0||!Number.isFinite(p)||!Number.isFinite(k))return;s.foods.push({id:'f'+Date.now(),n,u:$('nu').value,p,k,c,f:0});['nn','np','nk','nc'].forEach(i=>$(i).value='');save();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(b.dataset.v).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').style.display='block'});$('install').onclick=()=>dp&&dp.prompt();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');save();render();
</script></body></html>
